name: smoke-arm64

# Regression guard on an arm64 runner.
#
# job `jvm` (blocking): provisioning, JUnit build/test, and the doctor contract
# on aarch64. This is the part that can run on plain Linux.
#
# job `apk-qemu` (advisory): tries the full APK build by letting the Maven
# x86_64 aapt2 run under qemu-user. The arm64 aapt2 we ship is Termux's bionic
# build and needs /system/bin/linker64, which a GitHub runner does not have, so
# this job is allowed to fail without failing the workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'toolchain.manifest.json'
      - 'package.json'
      - '.github/workflows/smoke-arm64.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'toolchain.manifest.json'
      - 'package.json'
      - '.github/workflows/smoke-arm64.yml'

jobs:
  jvm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cache the provisioned toolchain
        uses: actions/cache@v5
        with:
          path: |
            /opt/android-toolchain/sdk
            /opt/android-toolchain/tmp
            /opt/android-toolchain/gradle-home
          key: android-toolchain-jvm-arm64-${{ hashFiles('toolchain.manifest.json', 'examples/**/*.gradle') }}
      - name: Smoke (provision + JUnit + doctor)
        run: sudo env "PATH=$PATH" "DSH_ANDROID_ROOT=/opt/android-toolchain" sh scripts/smoke.sh --jvm

  apk-qemu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cache the provisioned toolchain
        uses: actions/cache@v5
        with:
          path: |
            /opt/android-toolchain/sdk
            /opt/android-toolchain/tmp
            /opt/android-toolchain/gradle-home
          key: android-toolchain-apk-arm64-${{ hashFiles('toolchain.manifest.json', 'examples/**/*.gradle') }}
      - name: Install qemu-user plus the amd64 runtime the aapt2 needs
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo dpkg --add-architecture amd64
          sudo apt-get update
          sudo apt-get install -y libc6:amd64 libstdc++6:amd64
          ls -l /lib64/ld-linux-x86-64.so.2
          ls /proc/sys/fs/binfmt_misc | grep -i qemu || true
      - name: Smoke (provision + APK via qemu + JUnit)
        run: sudo env "PATH=$PATH" "DSH_ANDROID_ROOT=/opt/android-toolchain" sh scripts/smoke.sh --apk-ci
      - name: Keep the built APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hello-apk
          path: examples/hello-apk/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
