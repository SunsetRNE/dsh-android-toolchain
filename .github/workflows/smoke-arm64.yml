name: smoke-arm64

# Regression guard on GitHub's arm64 runner.
#
# Scope note: the arm64 aapt2 we ship is Termux's bionic build and needs
# /system/bin/linker64, so a plain Ubuntu arm64 runner cannot run it. Attempts
# to run Google's x86_64 aapt2 through qemu failed on the runner's binfmt setup
# (it cannot resolve /lib64/ld-linux-x86-64.so.2 for the daemon), so CI guards
# what it can honestly guard:
#
#   - provisioning of the pinned JDK/Gradle on aarch64
#   - cmdline-tools + platform + build-tools installation (setup-apk --no-aapt2)
#   - a real Java test build and the JUnit summary path
#   - cold/warm timing against bench/baselines.json
#   - the doctor contract (java arch, apksigner, platform)
#
# The toolchain lives in the runner's temp directory (runner-owned, so the
# cache step works without root); the shared area on the device is /opt.
# The APK path itself is guarded by `sh scripts/smoke.sh` on a real device and
# is part of the release checklist.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'bench/**'
      - 'toolchain.manifest.json'
      - 'package.json'
      - '.github/workflows/smoke-arm64.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'bench/**'
      - 'toolchain.manifest.json'
      - 'package.json'
      - '.github/workflows/smoke-arm64.yml'

jobs:
  jvm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Public upstream archives, keyed by the manifest: a version bump is a
      # new cache, everything else reuses it.
      - name: Prepare the toolchain root
        run: mkdir -p "$RUNNER_TEMP/android-toolchain"/{jdk,gradle,sdk,gradle-home/caches,gradle-home/wrapper}

      - name: Cache the shared toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/android-toolchain/jdk
            ${{ runner.temp }}/android-toolchain/gradle
            ${{ runner.temp }}/android-toolchain/sdk
            ${{ runner.temp }}/android-toolchain/gradle-home/caches
            ${{ runner.temp }}/android-toolchain/gradle-home/wrapper
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain.manifest.json') }}
          restore-keys: |
            toolchain-${{ runner.os }}-${{ runner.arch }}-

      - name: Smoke (provision + SDK + JUnit + bench + doctor)
        env:
          DSH_ANDROID_ROOT: ${{ runner.temp }}/android-toolchain
        run: sh scripts/smoke.sh --jvm
