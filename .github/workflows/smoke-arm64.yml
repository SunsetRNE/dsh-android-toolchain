name: smoke-arm64

# Regression guard on GitHub's arm64 runner.
#
# Scope note: the arm64 aapt2 we ship is Termux's bionic build and needs
# /system/bin/linker64, so a plain Ubuntu arm64 runner cannot run it. Attempts
# to run Google's x86_64 aapt2 through qemu failed on the runner's binfmt setup
# (it cannot resolve /lib64/ld-linux-x86-64.so.2 for the daemon), so CI guards
# what it can honestly guard:
#
#   - provisioning of the pinned JDK/Gradle on aarch64
#   - cmdline-tools + platform + build-tools installation (setup-apk --no-aapt2)
#   - a real Java test build and the JUnit summary path
#   - the doctor contract (java arch, apksigner, platform)
#
# The APK path itself is guarded by `sh scripts/smoke.sh` on a real device and is
# part of the release checklist.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'toolchain.manifest.json'
      - 'package.json'
      - '.github/workflows/smoke-arm64.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'src/**'
      - 'scripts/**'
      - 'examples/**'
      - 'toolchain.manifest.json'
      - 'package.json'
      - '.github/workflows/smoke-arm64.yml'

jobs:
  jvm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Smoke (provision + SDK + JUnit + doctor)
        run: sudo env "PATH=$PATH" "DSH_ANDROID_ROOT=/opt/android-toolchain" sh scripts/smoke.sh --jvm
