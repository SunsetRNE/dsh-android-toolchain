<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <rect width="640" height="300" rx="20" fill="#f3f5f9"/>

  <!-- two agent sessions -->
  <g fill="#ffffff" stroke="#b7c3d2" stroke-width="2">
    <rect x="48" y="64" width="152" height="84" rx="16"/>
    <rect x="48" y="164" width="152" height="84" rx="16"/>
  </g>
  <circle cx="76" cy="92" r="9" fill="#247bbf"/>
  <circle cx="76" cy="192" r="9" fill="#7b8b9f"/>
  <g fill="#e4edf8">
    <rect x="96" y="84" width="80" height="10" rx="5"/>
    <rect x="68" y="112" width="108" height="10" rx="5"/>
    <rect x="68" y="130" width="72" height="10" rx="5"/>
    <rect x="96" y="184" width="80" height="10" rx="5"/>
    <rect x="68" y="212" width="108" height="10" rx="5"/>
    <rect x="68" y="230" width="64" height="10" rx="5"/>
  </g>

  <!-- both requests join the one queue -->
  <g stroke="#247bbf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M208 106h34"/>
    <path d="M234 100l8 6-8 6"/>
    <path d="M208 206h34"/>
    <path d="M234 200l8 6-8 6"/>
  </g>

  <!-- single slot: one running, the rest waiting -->
  <rect x="258" y="64" width="92" height="172" rx="16" fill="#ffffff" stroke="#b7c3d2" stroke-width="2"/>
  <rect x="274" y="80" width="60" height="36" rx="9" fill="#247bbf"/>
  <path d="M296 90l14 8-14 8Z" fill="#ffffff"/>
  <g fill="none" stroke="#7b8b9f" stroke-width="2" stroke-dasharray="5 5">
    <rect x="274" y="128" width="60" height="36" rx="9"/>
    <rect x="274" y="176" width="60" height="36" rx="9"/>
  </g>

  <!-- the slot feeds one build at a time -->
  <g stroke="#247bbf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M352 150h16"/>
    <path d="M360 144l8 6-8 6"/>
  </g>

  <!-- JVM build box -->
  <rect x="376" y="64" width="216" height="172" rx="18" fill="#ffffff" stroke="#b7c3d2" stroke-width="2"/>
  <rect x="402" y="128" width="44" height="44" rx="10" fill="#e4edf8" stroke="#247bbf" stroke-width="2"/>
  <g fill="#247bbf">
    <rect x="410" y="120" width="8" height="8" rx="2"/>
    <rect x="430" y="120" width="8" height="8" rx="2"/>
    <rect x="410" y="172" width="8" height="8" rx="2"/>
    <rect x="430" y="172" width="8" height="8" rx="2"/>
    <rect x="394" y="136" width="8" height="8" rx="2"/>
    <rect x="394" y="156" width="8" height="8" rx="2"/>
    <rect x="446" y="136" width="8" height="8" rx="2"/>
    <rect x="446" y="156" width="8" height="8" rx="2"/>
  </g>

  <!-- artifact out -->
  <g stroke="#7b8b9f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M470 150h16"/>
    <path d="M478 144l8 6-8 6"/>
  </g>
  <rect x="496" y="112" width="64" height="76" rx="10" fill="#ffffff" stroke="#247bbf" stroke-width="2"/>
  <g fill="#e4edf8">
    <rect x="508" y="128" width="40" height="8" rx="4"/>
    <rect x="508" y="144" width="40" height="8" rx="4"/>
    <rect x="508" y="160" width="26" height="8" rx="4"/>
  </g>
  <circle cx="556" cy="188" r="14" fill="#2f8f5b"/>
  <path d="M549 188l5 5 9-10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
